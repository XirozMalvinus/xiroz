<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎵 Music Hub · Streaming</title>

  <!-- Tailwind + Google Font -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       RESET & GLOBAL
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0A0A0A;
      color: #FFFFFF;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* ============================================================
       SPLASH SCREEN — ANIMASI LOGO
       ============================================================ */
    .splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0A0A0A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .splash.fade-out {
      opacity: 0;
      transform: scale(1.05);
      pointer-events: none;
    }

    .logo-ring {
      position: relative;
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid transparent;
      animation: spin 3s linear infinite;
    }

    .ring-1 {
      width: 100%;
      height: 100%;
      border-top-color: #D94F14;
      border-right-color: rgba(217, 79, 20, 0.3);
      animation-duration: 2.8s;
    }

    .ring-2 {
      width: 85%;
      height: 85%;
      border-bottom-color: #4ADE80;
      border-left-color: rgba(74, 222, 128, 0.2);
      animation-duration: 3.6s;
      animation-direction: reverse;
    }

    .ring-3 {
      width: 70%;
      height: 70%;
      border-top-color: #FBBF24;
      border-right-color: rgba(251, 191, 36, 0.2);
      animation-duration: 4.2s;
    }

    .ring-4 {
      width: 55%;
      height: 55%;
      border-bottom-color: #6BB5FF;
      border-left-color: rgba(107, 181, 255, 0.2);
      animation-duration: 5s;
      animation-direction: reverse;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .logo-wrapper {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #1A1A1A;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(217, 79, 20, 0.25), 0 0 80px rgba(217, 79, 20, 0.08);
      animation: pulse 2.4s ease-in-out infinite;
      overflow: hidden;
      z-index: 2;
    }

    .logo-img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      border-radius: 50%;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 40px rgba(217, 79, 20, 0.25), 0 0 80px rgba(217, 79, 20, 0.08); }
      50% { box-shadow: 0 0 60px rgba(217, 79, 20, 0.45), 0 0 120px rgba(217, 79, 20, 0.15); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.03); }
    }

    .splash-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #FFFFFF 30%, #D94F14 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: fadeUp 1.2s ease 0.3s both;
    }

    .splash-sub {
      font-size: 14px;
      color: #888;
      letter-spacing: 2px;
      animation: fadeUp 1.2s ease 0.6s both;
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ============================================================
       APP LAYOUT
       ============================================================ */
    .app {
      display: none;
      height: 100vh;
      width: 100vw;
      background: #0A0A0A;
      overflow: hidden;
      flex-direction: column;
    }

    .app.visible {
      display: flex;
      animation: appIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes appIn {
      0% { opacity: 0; transform: scale(0.96); }
      100% { opacity: 1; transform: scale(1); }
    }

    .app-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ============================================================
       SIDEBAR
       ============================================================ */
    .sidebar {
      width: 240px;
      min-width: 240px;
      background: #111111;
      border-right: 1px solid #2A2A2A;
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      gap: 24px;
      height: 100%;
      flex-shrink: 0;
      overflow-y: auto;
    }

    .sidebar::-webkit-scrollbar {
      width: 3px;
    }
    .sidebar::-webkit-scrollbar-thumb {
      background: #2A2A2A;
      border-radius: 9999px;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid #1A1A1A;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-logo img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #D94F14;
      padding: 2px;
      animation: logoPulse 3s ease-in-out infinite;
    }

    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 0 8px rgba(217, 79, 20, 0.2); }
      50% { box-shadow: 0 0 20px rgba(217, 79, 20, 0.4); }
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      color: #888;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      transition: all 0.2s ease;
      position: relative;
      cursor: pointer;
    }

    .nav-link:hover {
      background: #1A1A1A;
      color: #FFFFFF;
    }

    .nav-link.active {
      background: #1A1A1A;
      color: #D94F14;
    }

    .nav-link.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 24px;
      background: #D94F14;
      border-radius: 0 4px 4px 0;
    }

    .nav-link svg {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
    }

    .nav-badge {
      margin-left: auto;
      background: #D94F14;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
      min-width: 20px;
      text-align: center;
    }

    .sidebar-footer {
      border-top: 1px solid #1A1A1A;
      padding-top: 16px;
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 10px;
      border-radius: 10px;
      background: #1A1A1A;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #2A2A2A;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    /* ============================================================
       MAIN CONTENT
       ============================================================ */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      background: #0A0A0A;
      padding: 0 32px 16px 32px;
    }

    /* Header */
    .main-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0 16px 0;
      border-bottom: 1px solid #1A1A1A;
      flex-shrink: 0;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-left h1 {
      font-size: 24px;
      font-weight: 700;
    }

    .header-left p {
      font-size: 14px;
      color: #888;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: #111111;
      border: 1px solid #2A2A2A;
      border-radius: 9999px;
      padding: 6px 16px;
      gap: 10px;
      transition: all 0.3s ease;
      min-width: 200px;
    }

    .search-box:focus-within {
      border-color: #D94F14;
      box-shadow: 0 0 0 3px rgba(217, 79, 20, 0.15);
    }

    .search-box svg {
      width: 18px;
      height: 18px;
      color: #888;
      flex-shrink: 0;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #FFFFFF;
      font-size: 14px;
      padding: 6px 0;
      width: 100%;
      font-family: 'Inter', sans-serif;
    }

    .search-box input::placeholder {
      color: #555;
    }

    .sort-select {
      background: #111111;
      border: 1px solid #2A2A2A;
      border-radius: 8px;
      padding: 6px 12px;
      color: #FFFFFF;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      outline: none;
    }

    .sort-select:focus {
      border-color: #D94F14;
    }

    /* Content Area */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding-top: 20px;
      padding-bottom: 20px;
    }

    .content-area::-webkit-scrollbar {
      width: 4px;
    }
    .content-area::-webkit-scrollbar-thumb {
      background: #2A2A2A;
      border-radius: 9999px;
    }

    .view-section {
      display: none;
      animation: slideIn 0.35s ease both;
    }

    .view-section.active {
      display: block;
    }

    @keyframes slideIn {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
    }

    .section-more {
      font-size: 13px;
      color: #888;
      text-decoration: none;
      transition: color 0.2s;
      cursor: pointer;
    }

    .section-more:hover {
      color: #D94F14;
    }

    /* ============================================================
       SONG CARDS
       ============================================================ */
    .song-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 16px;
      margin-top: 4px;
    }

    .song-card {
      background: #111111;
      border: 1px solid #1A1A1A;
      border-radius: 14px;
      padding: 16px 14px 14px 14px;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .song-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 14px;
      padding: 1px;
      background: linear-gradient(135deg, transparent 60%, rgba(217, 79, 20, 0.1));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .song-card:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: #2A2A2A;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .song-card:hover::before {
      opacity: 1;
    }

    .song-card .card-cover {
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: 10px;
      background: #1A1A1A;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      margin-bottom: 10px;
      transition: transform 0.3s ease;
    }

    .song-card:hover .card-cover {
      transform: scale(1.04);
    }

    .song-card .card-title {
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-card .card-artist {
      font-size: 12px;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-card .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 11px;
      color: #555;
    }

    .song-card .card-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .song-card .card-actions button {
      background: #1A1A1A;
      border: none;
      border-radius: 8px;
      padding: 4px 10px;
      color: #888;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: 'Inter', sans-serif;
    }

    .song-card .card-actions button:hover {
      background: #D94F14;
      color: #FFFFFF;
    }

    .song-card .card-actions button.download-btn {
      background: #1A2A3A;
      color: #6BB5FF;
    }

    .song-card .card-actions button.download-btn:hover {
      background: #2B6CFF;
      color: #FFFFFF;
    }

    .song-card .card-actions button svg {
      width: 14px;
      height: 14px;
    }

    .card-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #D94F14;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
    }

    .card-playing {
      border-color: #D94F14 !important;
      box-shadow: 0 0 20px rgba(217, 79, 20, 0.15);
    }

    /* ============================================================
       GENRE CHIPS
       ============================================================ */
    .genre-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .genre-chip {
      background: #111111;
      border: 1px solid #2A2A2A;
      border-radius: 9999px;
      padding: 8px 18px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .genre-chip:hover,
    .genre-chip.active {
      background: #D94F14;
      border-color: #D94F14;
      transform: scale(1.05);
    }

    /* ============================================================
       LIBRARY STATS
       ============================================================ */
    .library-stats {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .stat-card {
      background: #111111;
      border: 1px solid #2A2A2A;
      border-radius: 12px;
      padding: 14px 20px;
      min-width: 100px;
    }

    .stat-card .stat-number {
      font-size: 24px;
      font-weight: 800;
    }

    .stat-card .stat-label {
      font-size: 12px;
      color: #888;
    }

    /* ============================================================
       DOWNLOADS
       ============================================================ */
    .download-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .download-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #111111;
      border: 1px solid #2A2A2A;
      border-radius: 12px;
      padding: 12px 16px;
      animation: slideIn 0.3s ease both;
    }

    .download-item .dl-cover {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: #1A1A1A;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .download-item .dl-info {
      flex: 1;
    }

    .download-item .dl-title {
      font-weight: 600;
      font-size: 14px;
    }

    .download-item .dl-artist {
      font-size: 12px;
      color: #888;
    }

    .download-item .dl-status {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 12px;
      border-radius: 9999px;
    }

    .download-item .dl-status.complete {
      background: #0F1F14;
      color: #4ADE80;
    }

    .download-item .dl-status.downloading {
      background: #1F1A0F;
      color: #FBBF24;
      animation: blink 0.8s ease-in-out infinite;
    }

    .download-item .dl-status.error {
      background: #1F0F0F;
      color: #F87171;
    }

    .download-item .dl-progress {
      width: 80px;
      height: 4px;
      background: #2A2A2A;
      border-radius: 9999px;
      overflow: hidden;
    }

    .download-item .dl-progress .dl-bar {
      height: 100%;
      background: #4ADE80;
      border-radius: 9999px;
      transition: width 0.3s ease;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ============================================================
       PLAYER BAR
       ============================================================ */
    .player-bar {
      height: 72px;
      min-height: 72px;
      background: #111111;
      border-top: 1px solid #2A2A2A;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 160px;
      flex: 1;
    }

    .player-cover {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: #1A1A1A;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .player-title {
      font-weight: 600;
      font-size: 14px;
    }

    .player-artist {
      font-size: 12px;
      color: #888;
    }

    .player-fav {
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      transition: all 0.2s ease;
      padding: 4px;
    }

    .player-fav:hover {
      color: #D94F14;
    }

    .player-fav.active {
      color: #D94F14;
    }

    .player-fav svg {
      width: 18px;
      height: 18px;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ctrl-btn:hover {
      color: #FFFFFF;
      background: #1A1A1A;
    }

    .ctrl-btn svg {
      width: 20px;
      height: 20px;
    }

    .play-btn {
      width: 40px;
      height: 40px;
      background: #D94F14;
      color: #FFFFFF;
      border-radius: 50%;
    }

    .play-btn:hover {
      background: #B84010;
      transform: scale(1.05);
    }

    .play-btn svg {
      width: 18px;
      height: 18px;
      margin-left: 2px;
    }

    .player-progress {
      flex: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 120px;
    }

    .time-current,
    .time-total {
      font-size: 12px;
      color: #888;
      font-variant-numeric: tabular-nums;
      min-width: 36px;
    }

    .progress-track {
      flex: 1;
      height: 4px;
      background: #2A2A2A;
      border-radius: 9999px;
      position: relative;
      cursor: pointer;
    }

    .progress-bar {
      height: 100%;
      background: #D94F14;
      border-radius: 9999px;
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
      transition: width 0.1s linear;
    }

    .progress-slider {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 2;
    }

    .player-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 60px;
      justify-content: flex-end;
    }

    /* ============================================================
       TOAST
       ============================================================ */
    .toast-float {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: #1A1A1A;
      color: #FFFFFF;
      padding: 10px 24px;
      border-radius: 9999px;
      border: 1px solid #2A2A2A;
      font-size: 13px;
      font-weight: 500;
      z-index: 9999;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      font-family: 'Inter', sans-serif;
      animation: toastIn 0.3s ease both;
    }

    @keyframes toastIn {
      0% { opacity: 0; transform: translateX(-50%) translateY(20px) scale(0.95); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 1024px) {
      .sidebar {
        width: 200px;
        min-width: 200px;
        padding: 16px 12px;
      }
      .main-content {
        padding: 0 20px 12px 20px;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }

      .main-content {
        padding: 0 14px 10px 14px;
      }

      .main-header {
        flex-direction: column;
        align-items: stretch;
      }

      .header-right {
        flex-wrap: wrap;
      }

      .search-box {
        flex: 1;
        min-width: 120px;
      }

      .song-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 12px;
      }

      .player-bar {
        height: auto;
        padding: 12px 14px;
        gap: 10px;
      }

      .player-info {
        min-width: 120px;
      }

      .player-progress {
        flex: 1;
        min-width: 80px;
        order: 10;
        width: 100%;
      }

      .player-controls {
        order: 5;
      }

      .player-actions {
        order: 6;
        min-width: auto;
      }

        width: 120px;
        height: 120px;
      }

      .logo-wrapper {
        width: 60px;
        height: 60px;
      }

        height: 48px;
      }
    }

    @media (max-width: 480px) {
      .song-grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 10px;
      }

      .song-card {
        padding: 12px 10px 10px 10px;
      }

      .song-card .card-cover {
        font-size: 28px;
      }

      .search-box {
        min-width: 80px;
      }

      .search-box input {
        font-size: 12px;
      }

      .genre-chip {
        font-size: 12px;
        padding: 6px 14px;
      }
    }

    /* ============================================================
       SCROLLBAR GLOBAL
       ============================================================ */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #2A2A2A;
      border-radius: 9999px;
    }
  </style>
</head>
<body>

  <!-- ============================================================
       SPLASH SCREEN
       ============================================================ -->
  <div id="splash" class="splash">

          <circle cx="50" cy="50" r="45" fill="#D94F14" />

  <!-- ============================================================

  <div id="app" class="app">

    <div class="app-body">

        <div class="sidebar-header">

            <span>Home</span>

            <span>Downloads</span>

        <div class="sidebar-footer">

      <!-- MAIN -->

        <!-- HEADER -->
        <header class="main-header">

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>

    <!-- PLAYER BAR -->
    <footer class="player-bar" id="playerBar">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>

        <button class="ctrl-btn" id="prevBtn" title="Previous">

        </button>
      </div>

  <!-- ============================================================
       JAVASCRIPT — FULL LOGIC
       ============================================================ -->
  <script>
    (function() {
      'use strict';

      // ==========================================================
      //  DATA
      // ==========================================================
      const GENRES = ['Pop', 'Rock', 'Hip-Hop', 'Electronic', 'Jazz', 'Classical', 'R&B', 'Indie', 'Metal', 'Folk'];

      const SONG_DATA = [
        { id: 's1', title: 'Blinding Lights', artist: 'The Weeknd', genre: 'Pop', duration: 200, cover: '🌃' },
        { id: 's2', title: 'Shape of You', artist: 'Ed Sheeran', genre: 'Pop', duration: 233, cover: '🔴' },
        { id: 's3', title: 'Bohemian Rhapsody', artist: 'Queen', genre: 'Rock', duration: 354, cover: '🎸' },
        { id: 's4', title: 'Starboy', artist: 'The Weeknd', genre: 'Pop', duration: 230, cover: '⭐' },
        { id: 's5', title: 'Lose Yourself', artist: 'Eminem', genre: 'Hip-Hop', duration: 326, cover: '🎤' },
        { id: 's6', title: 'Smells Like Teen Spirit', artist: 'Nirvana', genre: 'Rock', duration: 300, cover: '🤘' },
        { id: 's7', title: 'Get Lucky', artist: 'Daft Punk', genre: 'Electronic', duration: 247, cover: '💫' },
        { id: 's8', title: 'Take Five', artist: 'Dave Brubeck', genre: 'Jazz', duration: 340, cover: '🎷' },
        { id: 's9', title: 'Clair de Lune', artist: 'Debussy', genre: 'Classical', duration: 302, cover: '🌙' },
        { id: 's10', title: 'Blinding Lights (Remix)', artist: 'The Weeknd', genre: 'Pop', duration: 210, cover: '🌌' },
        { id: 's11', title: 'HUMBLE', artist: 'Kendrick Lamar', genre: 'Hip-Hop', duration: 177, cover: '🏆' },
        { id: 's12', title: 'Boogie Wonderland', artist: 'Earth Wind & Fire', genre: 'R&B', duration: 278, cover: '🕺' },
        { id: 's13', title: 'Mr. Brightside', artist: 'The Killers', genre: 'Indie', duration: 222, cover: '😎' },
        { id: 's14', title: 'One More Time', artist: 'Daft Punk', genre: 'Electronic', duration: 300, cover: '🔄' },
        { id: 's15', title: 'All of Me', artist: 'John Legend', genre: 'R&B', duration: 270, cover: '❤️' },
        { id: 's16', title: 'Creep', artist: 'Radiohead', genre: 'Indie', duration: 248, cover: '👀' },
        { id: 's17', title: 'Enter Sandman', artist: 'Metallica', genre: 'Metal', duration: 332, cover: '🎸' },
        { id: 's18', title: 'The Sound of Silence', artist: 'Simon & Garfunkel', genre: 'Folk', duration: 183, cover: '🌿' },
        { id: 's19', title: 'Dancing Queen', artist: 'ABBA', genre: 'Pop', duration: 217, cover: '👑' },
        { id: 's20', title: 'Hotel California', artist: 'Eagles', genre: 'Rock', duration: 390, cover: '🏨' },
      ];

      // ==========================================================
      //  STATE
      // ==========================================================
      let songs = SONG_DATA.map(s => ({
        ...s,
        isFavorite: false,
        isDownloaded: false,
      }));

      let downloads = [];
      let currentSongId = null;
      let isPlaying = false;
      let currentProgress = 0; // in seconds
      let currentDuration = 0;
      let progressRAF = null;
      let currentView = 'home';

      // ==========================================================
      //  DOM REFS
      // ==========================================================
      const $ = sel => document.querySelector(sel);
      const $$ = sel => document.querySelectorAll(sel);

      const splash = $('#splash');
      const app = $('#app');

      const songGrid = $('#songGrid');
      const featuredGrid = $('#featuredGrid');
      const exploreGrid = $('#exploreGrid');
      const libraryGrid = $('#libraryGrid');
      const downloadList = $('#downloadList');
      const genreGrid = $('#genreGrid');
      const libraryStats = $('#libraryStats');
      const searchInput = $('#searchInput');
      const sortSelect = $('#sortSelect');
      const downloadBadge = $('#downloadBadge');

      const playerTitle = $('#playerTitle');
      const playerArtist = $('#playerArtist');
      const playerCover = $('#playerCover');
      const playerFav = $('#playerFav');
      const playBtn = $('#playBtn');
      const prevBtn = $('#prevBtn');
      const nextBtn = $('#nextBtn');
      const downloadBtn = $('#downloadBtn');
      const progressBar = $('#progressBar');
      const progressSlider = $('#progressSlider');
      const timeCurrent = $('#timeCurrent');
      const timeTotal = $('#timeTotal');

      const navLinks = $$('.nav-link');
      const viewSections = {
        home: $('#view-home'),
        explore: $('#view-explore'),
        library: $('#view-library'),
        downloads: $('#view-downloads'),
      };
      const pageTitle = $('#pageTitle');
      const pageSub = $('#pageSub');

      // ==========================================================
      //  UTILITY
      // ==========================================================
      function formatTime(seconds) {
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m}:${s.toString().padStart(2, '0')}`;
      }

      function shuffleArray(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function getSongById(id) {
        return songs.find(s => s.id === id);
      }

      function getDownloadCount() {
        return downloads.filter(d => d.status === 'complete').length;
      }

      function getFavoriteCount() {
        return songs.filter(s => s.isFavorite).length;
      }

      function getSortedSongs() {
        const q = searchInput.value.toLowerCase().trim();
        let filtered = songs.filter(s =>
          s.title.toLowerCase().includes(q) ||
          s.artist.toLowerCase().includes(q) ||
          s.genre.toLowerCase().includes(q)
        );
        const sortBy = sortSelect.value;
        if (sortBy === 'title') filtered.sort((a, b) => a.title.localeCompare(b.title));
        else if (sortBy === 'artist') filtered.sort((a, b) => a.artist.localeCompare(b.artist));
        else if (sortBy === 'duration') filtered.sort((a, b) => a.duration - b.duration);
        return filtered;
      }

      // ==========================================================
      //  TOAST
      // ==========================================================
      function toast(message) {
        const existing = document.querySelector('.toast-float');
        if (existing) existing.remove();

        const div = document.createElement('div');
        div.className = 'toast-float';
        div.textContent = message;
        document.body.appendChild(div);

        setTimeout(() => {
          div.style.opacity = '0';
          div.style.transform = 'translateX(-50%) translateY(20px)';
          div.style.transition = 'all 0.3s ease';
          setTimeout(() => div.remove(), 400);
        }, 2800);
      }

      // ==========================================================
      //  RENDER FUNCTIONS
      // ==========================================================
      function renderSongCard(song, grid, isFeatured = false) {
        const card = document.createElement('div');
        card.className = 'song-card';
        card.dataset.id = song.id;

        if (song.id === currentSongId) {
          card.classList.add('card-playing');
        }

        card.innerHTML = `
          ${isFeatured ? '<span class="card-badge">⭐ Featured</span>' : ''}
          <div class="card-cover">${song.cover}</div>
          <div class="card-title">${song.title}</div>
          <div class="card-artist">${song.artist}</div>
          <div class="card-meta">
            <span>${song.genre}</span>
            <span>${formatTime(song.duration)}</span>
          </div>
          <div class="card-actions">
            <button class="play-card-btn" data-id="${song.id}">
              <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              Play
            </button>
            <button class="download-card-btn" data-id="${song.id}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              ${song.isDownloaded ? '✓ Downloaded' : 'Download'}
            </button>
          </div>
        `;

        // Play
        card.querySelector('.play-card-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          playSong(song.id);
        });

        // Download
        card.querySelector('.download-card-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          startDownload(song.id);
        });

        // Click card
        card.addEventListener('click', () => playSong(song.id));

        grid.appendChild(card);
      }

      function renderAllSongs() {
        songGrid.innerHTML = '';
        const sorted = getSortedSongs();
        sorted.forEach(s => renderSongCard(s, songGrid));
      }

      function renderFeatured() {
        featuredGrid.innerHTML = '';
        const shuffled = shuffleArray(songs).slice(0, 6);
        shuffled.forEach(s => renderSongCard(s, featuredGrid, true));
      }

      function renderExplore() {
        // Genres
        genreGrid.innerHTML = '';
        GENRES.forEach(g => {
          const chip = document.createElement('div');
          chip.className = 'genre-chip';
          chip.textContent = g;
          chip.addEventListener('click', () => {
            // Highlight active
            $$('.genre-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            const filtered = songs.filter(s => s.genre === g);
            exploreGrid.innerHTML = '';
            filtered.forEach(s => renderSongCard(s, exploreGrid));
            exploreGrid.scrollIntoView({ behavior: 'smooth' });
          });
          genreGrid.appendChild(chip);
        });

        // Default explore grid
        exploreGrid.innerHTML = '';
        const shuffled = shuffleArray(songs).slice(0, 12);
        shuffled.forEach(s => renderSongCard(s, exploreGrid));
      }

      function renderLibrary() {
        const favs = songs.filter(s => s.isFavorite);
        libraryStats.innerHTML = `
          <div class="stat-card">
            <div class="stat-number">${songs.length}</div>
            <div class="stat-label">Total Songs</div>
          </div>
          <div class="stat-card">
            <div class="stat-number">${favs.length}</div>
            <div class="stat-label">Favorites</div>
          </div>
          <div class="stat-card">
            <div class="stat-number">${getDownloadCount()}</div>
            <div class="stat-label">Downloaded</div>
          </div>
        `;

        libraryGrid.innerHTML = '';
        if (favs.length === 0) {
          libraryGrid.innerHTML = `<div class="text-[#888] text-center py-8 col-span-full">No favorites yet. ❤️ Tap the heart on a song!</div>`;
        } else {
          favs.forEach(s => renderSongCard(s, libraryGrid));
        }
      }

      function renderDownloads() {
        downloadList.innerHTML = '';
        if (downloads.length === 0) {
          downloadList.innerHTML = `<div class="text-[#888] text-center py-8">No downloads yet. ⬇️ Download a song to see it here.</div>`;
          updateDownloadBadge();
          return;
        }

        downloads.forEach(d => {
          const item = document.createElement('div');
          item.className = 'download-item';
          const statusMap = {
            pending: '⏳ Pending',
            downloading: '⬇️ Downloading',
            complete: '✅ Complete',
            error: '❌ Error',
          };
          const statusClass = d.status === 'complete' ? 'complete' :
            d.status === 'downloading' ? 'downloading' :
            d.status === 'error' ? 'error' : '';

          const song = getSongById(d.songId);
          const cover = song ? song.cover : '🎵';

          item.innerHTML = `
            <div class="dl-cover">${cover}</div>
            <div class="dl-info">
              <div class="dl-title">${d.title}</div>
              <div class="dl-artist">${d.artist}</div>
            </div>
            ${d.status === 'downloading' ? `
              <div class="dl-progress">
                <div class="dl-bar" style="width:${d.progress}%"></div>
              </div>
            ` : ''}
            <span class="dl-status ${statusClass}">${statusMap[d.status] || d.status}</span>
          `;
          downloadList.appendChild(item);
        });

        updateDownloadBadge();
      }

      function updateDownloadBadge() {
        const count = getDownloadCount();
        downloadBadge.textContent = String(count);
        downloadBadge.style.display = count > 0 ? 'inline-block' : 'none';
      }

      // ==========================================================
      //  PLAYER
      // ==========================================================
      function playSong(id) {
        const song = getSongById(id);
        if (!song) return;

        // If same song, just toggle
        if (currentSongId === id) {
          togglePlay();
          return;
        }

        // Stop previous
        if (progressRAF) {
          cancelAnimationFrame(progressRAF);
          progressRAF = null;
        }

        currentSongId = id;
        currentDuration = song.duration;
        currentProgress = 0;

        // Update UI
        playerTitle.textContent = song.title;
        playerArtist.textContent = song.artist;
        playerCover.textContent = song.cover;
        timeTotal.textContent = formatTime(song.duration);
        timeCurrent.textContent = '0:00';
        progressBar.style.width = '0%';
        progressSlider.value = '0';

        // Fav button
        updateFavButton();

        // Highlight card
        $$('.song-card').forEach(c => c.classList.remove('card-playing'));
        const cards = $$('.song-card');
        for (const c of cards) {
          if (c.dataset.id === id) {
            c.classList.add('card-playing');
          }
        }

        // Start playing
        isPlaying = true;
        updatePlayButton();

        // Progress simulation (real-time)
        let lastTime = performance.now();
        let elapsed = 0;

        function step(now) {
          const delta = (now - lastTime) / 1000;
          lastTime = now;

          if (isPlaying) {
            elapsed += delta;
            if (elapsed >= song.duration) {
              elapsed = song.duration;
              isPlaying = false;
              updatePlayButton();
              progressBar.style.width = '100%';
              timeCurrent.textContent = formatTime(song.duration);
              progressSlider.value = '100';
              currentProgress = song.duration;
              progressRAF = null;
              return;
            }
            currentProgress = elapsed;
            const pct = (elapsed / song.duration) * 100;
            progressBar.style.width = `${pct}%`;
            progressSlider.value = String(pct);
            timeCurrent.textContent = formatTime(elapsed);
          }

          progressRAF = requestAnimationFrame(step);
        }

        progressRAF = requestAnimationFrame(step);
        toast(`▶️ Now playing: ${song.title}`);
      }

      function togglePlay() {
        if (!currentSongId) {
          if (songs.length > 0) playSong(songs[0].id);
          return;
        }
        isPlaying = !isPlaying;
        updatePlayButton();
        if (isPlaying) {
          // Resume simulation
          const song = getSongById(currentSongId);
          if (!song) return;
          let lastTime = performance.now();
          let elapsed = currentProgress;

          function step(now) {
            const delta = (now - lastTime) / 1000;
            lastTime = now;

            if (isPlaying) {
              elapsed += delta;
              if (elapsed >= song.duration) {
                elapsed = song.duration;
                isPlaying = false;
                updatePlayButton();
                progressBar.style.width = '100%';
                timeCurrent.textContent = formatTime(song.duration);
                progressSlider.value = '100';
                currentProgress = song.duration;
                progressRAF = null;
                return;
              }
              currentProgress = elapsed;
              const pct = (elapsed / song.duration) * 100;
              progressBar.style.width = `${pct}%`;
              progressSlider.value = String(pct);
              timeCurrent.textContent = formatTime(elapsed);
            }

            progressRAF = requestAnimationFrame(step);
          }

          progressRAF = requestAnimationFrame(step);
        }
      }

      function updatePlayButton() {
        if (isPlaying) {
          playBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;
        } else {
          playBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;
        }
      }

      function updateFavButton() {
        if (!currentSongId) return;
        const song = getSongById(currentSongId);
        if (!song) return;
        playerFav.classList.toggle('active', song.isFavorite);
      }

      function toggleFavorite() {
        if (!currentSongId) return;
        const song = getSongById(currentSongId);
        if (!song) return;
        song.isFavorite = !song.isFavorite;
        updateFavButton();
        // Refresh views
        renderAllSongs();
        renderFeatured();
        renderExplore();
        renderLibrary();
        renderDownloads();
      }

      function prevSong() {
        if (!currentSongId) return;
        const idx = songs.findIndex(s => s.id === currentSongId);
        if (idx > 0) playSong(songs[idx - 1].id);
      }

      function nextSong() {
        if (!currentSongId) return;
        const idx = songs.findIndex(s => s.id === currentSongId);
        if (idx < songs.length - 1) playSong(songs[idx + 1].id);
      }

      // ==========================================================
      //  DOWNLOAD
      // ==========================================================
      function startDownload(songId) {
        const song = getSongById(songId);
        if (!song) return;

        if (song.isDownloaded) {
          toast('✅ Already downloaded');
          return;
        }

        const existing = downloads.find(d => d.songId === songId && d.status !== 'complete');
        if (existing) {
          toast('⏳ Already downloading...');
          return;
        }

        const task = {
          id: `dl_${Date.now()}`,
          songId: song.id,
          title: song.title,
          artist: song.artist,
          progress: 0,
          status: 'downloading',
        };

        downloads.push(task);
        renderDownloads();
        toast(`⬇️ Downloading "${song.title}"...`);

        let prog = 0;
        const interval = setInterval(() => {
          prog += 5 + Math.random() * 15;
          if (prog >= 100) {
            prog = 100;
            clearInterval(interval);
            task.status = 'complete';
            task.progress = 100;
            song.isDownloaded = true;
            renderDownloads();
            renderAllSongs();
            renderFeatured();
            renderExplore();
            renderLibrary();
            toast(`✅ "${song.title}" downloaded!`);
            return;
          }
          task.progress = Math.min(prog, 100);
          renderDownloads();
        }, 300 + Math.random() * 400);
      }

      // ==========================================================
      //  NAVIGATION
      // ==========================================================
      function navigateTo(view) {
        currentView = view;

        // Update nav
        navLinks.forEach(link => link.classList.remove('active'));
        const targetLink = Array.from(navLinks).find(link => link.dataset.view === view);
        if (targetLink) targetLink.classList.add('active');

        // Update sections
        Object.entries(viewSections).forEach(([key, el]) => {
          el.classList.toggle('active', key === view);
        });

        // Update title
        const titles = {
          home: 'Home',
          explore: 'Explore',
          library: 'Library',
          downloads: 'Downloads',
        };
        const subs = {
          home: 'Discover your favorite tracks',
          explore: 'Find new music by genre',
          library: 'Your saved and loved songs',
          downloads: 'All your downloaded tracks',
        };
        pageTitle.textContent = titles[view];
        pageSub.textContent = subs[view];

        // Render on demand
        if (view === 'explore') renderExplore();
        if (view === 'library') renderLibrary();
        if (view === 'downloads') renderDownloads();
      }

      // ==========================================================
      //  SPLASH
      // ==========================================================
      function hideSplash() {
        splash.classList.add('fade-out');
        setTimeout(() => {
          splash.style.display = 'none';
          app.classList.remove('hidden');
          app.classList.add('visible');
        }, 800);
      }

      // ==========================================================
      //  INIT
      // ==========================================================
      function init() {
        // Hide splash after animation
        setTimeout(hideSplash, 3200);

        // Render initial
        renderAllSongs();
        renderFeatured();
        renderExplore();
        renderLibrary();
        renderDownloads();

        // Events
        searchInput.addEventListener('input', renderAllSongs);
        sortSelect.addEventListener('change', renderAllSongs);

        navLinks.forEach(link => {
          link.addEventListener('click', (e) => {
            e.preventDefault();
            const view = link.dataset.view;
            if (view) navigateTo(view);
          });
        });

        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);
        playerFav.addEventListener('click', toggleFavorite);

        downloadBtn.addEventListener('click', () => {
          if (currentSongId) startDownload(currentSongId);
        });

        progressSlider.addEventListener('input', (e) => {
          const val = parseFloat(e.target.value);
          if (!currentSongId) return;
          const song = getSongById(currentSongId);
          if (!song) return;
          const newTime = (val / 100) * song.duration;
          currentProgress = newTime;
          progressBar.style.width = `${val}%`;
          timeCurrent.textContent = formatTime(newTime);
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
          if (e.target instanceof HTMLInputElement) return;
          if (e.key === ' ' || e.key === 'Space') {
            e.preventDefault();
            togglePlay();
          }
          if (e.key === 'ArrowRight') nextSong();
          if (e.key === 'ArrowLeft') prevSong();
        });

        console.log('🎵 Music Hub loaded!');
        console.log(`📀 ${songs.length} songs ready.`);
      }

      document.addEventListener('DOMContentLoaded', init);

    })();
  </script>

</body>
