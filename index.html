<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Dashboard · Downloader</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles.css" />
  <!-- Favicon -->
  <link rel="icon" href="logo.png" type="image/png" />
</head>
<body>

  <!-- ============================================================
       SPLASH SCREEN — ANIMASI LOGO
       ============================================================ -->
  <div id="splash" class="splash-screen">
    <div class="logo-ring">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
      <div class="ring ring-4"></div>
      <div class="logo-wrapper">
        <img src="logo.png" alt="Logo" class="logo-img" />
      </div>
    </div>
    <p class="splash-title">Music Hub</p>
    <p class="splash-sub">loading your playlist ...</p>
  </div>

  <!-- ============================================================
       MAIN DASHBOARD
       ============================================================ -->
  <div id="app" class="app hidden">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <img src="logo.png" alt="Logo" class="w-8 h-8 rounded-full" />
          <span class="text-lg font-bold text-white">Music<span class="text-[#D94F14]">Hub</span></span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="nav-link active" data-view="home">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1"/></svg>
          <span>Home</span>
        </a>
        <a href="#" class="nav-link" data-view="explore">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <span>Explore</span>
        </a>
        <a href="#" class="nav-link" data-view="library">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          <span>Library</span>
        </a>
        <a href="#" class="nav-link" data-view="downloads">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Downloads</span>
          <span class="nav-badge" id="downloadBadge">0</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-card">
          <div class="user-avatar">🎧</div>
          <div>
            <div class="text-sm font-semibold text-white">Listener</div>
            <div class="text-xs text-[#888]">Free Plan</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

      <!-- HEADER -->
      <header class="main-header">
        <div class="header-left">
          <h1 class="text-2xl font-bold text-white" id="pageTitle">Home</h1>
          <p class="text-sm text-[#888]" id="pageSub">Discover your favorite tracks</p>
        </div>
        <div class="header-right">
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Search songs, artists..." />
          </div>
          <button class="theme-toggle" id="themeToggle" title="Toggle Theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
        </div>
      </header>

      <!-- CONTENT AREA -->
      <div class="content-area" id="contentArea">

        <!-- HOME VIEW -->
        <section id="view-home" class="view-section active">
          <!-- Featured -->
          <div class="section-header">
            <h2 class="section-title">🔥 Featured This Week</h2>
            <a href="#" class="section-more">See all →</a>
          </div>
          <div class="featured-grid" id="featuredGrid"></div>

          <!-- All Songs -->
          <div class="section-header mt-8">
            <h2 class="section-title">🎵 All Songs</h2>
            <div class="flex items-center gap-3">
              <select id="sortSelect" class="sort-select">
                <option value="title">Sort by Title</option>
                <option value="artist">Sort by Artist</option>
                <option value="duration">Sort by Duration</option>
              </select>
            </div>
          </div>
          <div class="song-grid" id="songGrid"></div>
        </section>

        <!-- EXPLORE VIEW -->
        <section id="view-explore" class="view-section hidden">
          <div class="section-header">
            <h2 class="section-title">🌍 Explore</h2>
          </div>
          <div class="genre-grid" id="genreGrid"></div>
          <div class="song-grid mt-6" id="exploreGrid"></div>
        </section>

        <!-- LIBRARY VIEW -->
        <section id="view-library" class="view-section hidden">
          <div class="section-header">
            <h2 class="section-title">📚 Your Library</h2>
          </div>
          <div class="library-stats" id="libraryStats"></div>
          <div class="song-grid mt-4" id="libraryGrid"></div>
        </section>

        <!-- DOWNLOADS VIEW -->
        <section id="view-downloads" class="view-section hidden">
          <div class="section-header">
            <h2 class="section-title">⬇️ Downloads</h2>
          </div>
          <div id="downloadList" class="download-list"></div>
        </section>

      </div>
    </main>

    <!-- BOTTOM PLAYER -->
    <footer class="player-bar" id="playerBar">
      <div class="player-info">
        <div class="player-thumb" id="playerThumb">🎵</div>
        <div>
          <div class="player-title" id="playerTitle">No song selected</div>
          <div class="player-artist" id="playerArtist">—</div>
        </div>
        <button class="player-fav" id="playerFav" title="Add to favorites">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </button>
      </div>

      <div class="player-controls">
        <button class="ctrl-btn" id="prevBtn" title="Previous">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="4" x2="5" y2="20"/></svg>
        </button>
        <button class="ctrl-btn play-btn" id="playBtn" title="Play / Pause">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </button>
        <button class="ctrl-btn" id="nextBtn" title="Next">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="4" x2="19" y2="20"/></svg>
        </button>
      </div>

      <div class="player-progress">
        <span class="time-current" id="timeCurrent">0:00</span>
        <div class="progress-track">
          <div class="progress-bar" id="progressBar" style="width:0%"></div>
          <input type="range" id="progressSlider" class="progress-slider" min="0" max="100" value="0" />
        </div>
        <span class="time-total" id="timeTotal">0:00</span>
      </div>

      <div class="player-actions">
        <button class="ctrl-btn" id="downloadBtn" title="Download current song">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <button class="ctrl-btn" id="volumeBtn" title="Volume">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <!-- ============================================================
       SCRIPTS
       ============================================================ -->
  <script src="app.js"></script>
</body>
</html>
